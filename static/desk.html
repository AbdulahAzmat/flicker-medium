<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flick</title>
<style>
  :root {
    --bg: #0b0d10; --panel: #15191e; --line: #262c34;
    --text: #eef1f4; --muted: #8b95a1; --accent: #7cf5c4;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--bg); color: var(--text); overflow-x: hidden;
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  header { display: flex; align-items: center; gap: 14px; padding: 18px 28px; border-bottom: 1px solid var(--line); }
  .mark { font-size: 18px; font-weight: 700; letter-spacing: -0.02em; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .dot.on { background: var(--accent); box-shadow: 0 0 10px var(--accent); }
  .folder { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 1; }
  .btn { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 14px; white-space: nowrap; }
  .btn:hover { border-color: #3a424d; }
  #phones { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--muted); white-space: nowrap; }
  .phone { display: inline-flex; align-items: center; gap: 7px; color: var(--text); border: 1px solid var(--line); border-radius: 999px; padding: 5px 11px; }
  .phone::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 8px var(--accent); }

  #pair { position: fixed; top: 70px; right: 28px; z-index: 5; width: 250px; padding: 18px; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5); }
  #pair[hidden] { display: none; }
  #pair img { display: block; width: 100%; border-radius: 8px; }
  #pair ol { margin: 14px 0 0; padding-left: 18px; color: var(--muted); font-size: 13px; }
  #pair li + li { margin-top: 4px; }

  main { padding: 28px; }
  #empty { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; min-height: 60vh; color: var(--muted); }
  #empty h1 { color: var(--text); font-size: 26px; font-weight: 600; letter-spacing: -0.02em; margin: 0 0 6px; }
  #empty[hidden] { display: none; }

  #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 18px; }
  .tile { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; will-change: transform; }
  .tile.fresh { border-color: var(--accent); z-index: 3; }
  .open { display: block; width: 100%; padding: 0; background: none; border: 0; text-align: left; }
  .thumb { aspect-ratio: 4 / 3; display: flex; align-items: center; justify-content: center; background: #0f1216; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .ext { font-size: 26px; font-weight: 700; letter-spacing: 0.04em; color: var(--accent); }
  .info { padding: 10px 12px 12px; }
  .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; }
  .meta { color: var(--muted); font-size: 12px; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .reveal { position: absolute; top: 8px; right: 8px; font-size: 12px; padding: 4px 8px; border-radius: 8px; background: rgba(11, 13, 16, 0.8); border: 1px solid var(--line); opacity: 0; transition: opacity 0.15s; }
  .tile:hover .reveal, .reveal:focus-visible { opacity: 1; }

  #glow { position: fixed; left: 0; right: 0; bottom: 0; height: 40vh; pointer-events: none; opacity: 0; background: radial-gradient(ellipse at 50% 100%, rgba(124, 245, 196, 0.35), transparent 65%); }
</style>
</head>
<body>
  <header>
    <span class="mark">Flick</span>
    <span class="dot" id="dot" title="Connection to the Flick server"></span>
    <span class="folder" id="folder"></span>
    <span id="phones" aria-live="polite"></span>
    <button class="btn" id="openFolder">Open folder</button>
    <button class="btn" id="pairBtn" aria-expanded="false">Pair phone</button>
  </header>

  <aside id="pair" hidden>
    <img id="qr" alt="QR code that opens Flick on your phone">
    <ol>
      <li>Phone on the same Wi-Fi as this laptop.</li>
      <li>Scan with the camera.</li>
      <li>Accept the one-time certificate warning (it's your own laptop).</li>
    </ol>
  </aside>

  <main>
    <div id="empty">
      <h1>Ready to catch</h1>
      <div>Pick something on your phone and flick it over.</div>
    </div>
    <div id="grid"></div>
  </main>
  <div id="glow"></div>

<script>
const $ = (id) => document.getElementById(id);
const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;

function fmt(n) {
  if (n < 1024) return n + ' B';
  const u = ['KB', 'MB', 'GB']; let i = -1;
  do { n /= 1024; i++; } while (n >= 1024 && i < 2);
  return n.toFixed(n < 10 ? 1 : 0) + ' ' + u[i];
}
function when(t) {
  const d = new Date(t * 1000), today = new Date().toDateString() === d.toDateString();
  return today ? d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })
               : d.toLocaleDateString([], { month: 'short', day: 'numeric' });
}
function openFile(name, reveal) {
  fetch('/api/open', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name, reveal }) });
}

function tile(f) {
  const el = document.createElement('div'); el.className = 'tile';
  const open = document.createElement('button'); open.className = 'open'; open.title = 'Open ' + f.name;
  const thumb = document.createElement('div'); thumb.className = 'thumb';
  if (f.kind === 'image') {
    const img = document.createElement('img'); img.alt = ''; img.loading = 'lazy';
    img.src = '/inbox/' + encodeURIComponent(f.name); thumb.appendChild(img);
  } else {
    const ext = document.createElement('div'); ext.className = 'ext';
    ext.textContent = (f.name.includes('.') ? f.name.split('.').pop() : 'file').slice(0, 5).toUpperCase();
    thumb.appendChild(ext);
  }
  const info = document.createElement('div'); info.className = 'info';
  const name = document.createElement('div'); name.className = 'name'; name.textContent = f.name;
  const meta = document.createElement('div'); meta.className = 'meta'; meta.textContent = (f.from ? 'From ' + f.from + ' · ' : '') + fmt(f.size) + ' · ' + when(f.time);
  meta.title = meta.textContent;
  info.append(name, meta); open.append(thumb, info);
  open.addEventListener('click', () => openFile(f.name, false));
  const reveal = document.createElement('button'); reveal.className = 'reveal'; reveal.textContent = 'Show in folder';
  reveal.addEventListener('click', () => openFile(f.name, true));
  el.append(open, reveal);
  return el;
}

// A thrown file comes up from the bottom edge (where the phone is) and settles into the grid.
function land(files, power) {
  $('empty').hidden = true;
  togglePair(false);
  const grid = $('grid');
  const fresh = files.map(tile);
  grid.prepend(...fresh);
  if (calm) return;
  $('glow').animate([{ opacity: 0 }, { opacity: 1, offset: 0.25 }, { opacity: 0 }], { duration: 900 });
  fresh.forEach((el, i) => {
    const r = el.getBoundingClientRect();
    const dx = innerWidth / 2 - (r.left + r.width / 2);
    const dy = innerHeight + 80 - r.top;
    const spin = (Math.random() * 30 - 15) * (0.5 + power);
    el.classList.add('fresh');
    el.animate([
      { transform: `translate(${dx}px, ${dy}px) scale(1.7) rotate(${spin}deg)`, opacity: 0.85 },
      { transform: `translate(${dx * 0.15}px, -26px) scale(1.12) rotate(${spin * -0.15}deg)`, opacity: 1, offset: 0.62 },
      { transform: 'none' },
    ], { duration: 950 - power * 350, delay: i * 90, easing: 'cubic-bezier(0.2, 0.8, 0.2, 1)', fill: 'backwards' });
    setTimeout(() => el.classList.remove('fresh'), 4000 + i * 90);
  });
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function listen() {
  const ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onopen = () => { $('dot').className = 'dot on'; };
  ws.onmessage = (e) => {
    const m = JSON.parse(e.data);
    if (m.type === 'drop') land(m.files, m.power);
    else if (m.type === 'phones') showPhones(m.phones);
    else if (m.type === 'address') { $('qr').src = '/api/qr.svg?' + Date.now(); togglePair(true); }
  };
  ws.onclose = () => { $('dot').className = 'dot'; showPhones([]); setTimeout(listen, 1500); };
}

// Which phones have Flick open right now.
function showPhones(names) {
  const box = $('phones');
  box.replaceChildren();
  if (!names.length) { box.textContent = 'No phone connected'; return; }
  for (const name of names) {
    const chip = document.createElement('span'); chip.className = 'phone'; chip.textContent = name;
    box.appendChild(chip);
  }
}

async function init() {
  const info = await (await fetch('/api/info')).json();
  $('folder').textContent = info.folder;
  $('qr').src = '/api/qr.svg';
  showPhones(info.phones);
  const { files } = await (await fetch('/api/recent')).json();
  if (files.length) { $('empty').hidden = true; $('grid').append(...files.map(tile)); }
  if (!files.length || location.search.includes('pair')) togglePair(true);
  listen();
}
function togglePair(show) {
  const p = $('pair');
  p.hidden = show === undefined ? !p.hidden : !show;
  $('pairBtn').setAttribute('aria-expanded', String(!p.hidden));
}
$('pairBtn').addEventListener('click', () => togglePair());
$('openFolder').addEventListener('click', () => openFile('', false));
init();
</script>
</body>
</html>
